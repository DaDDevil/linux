%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/boe,aa545-p-3-a0005.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BOE AA545 P 3 A0005 AMOLED DSI panel

maintainers:
  - Thierry Reding <thierry.reding@gmail.com>
  - Sam Ravnborg <sam@ravnborg.org>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: boe,aa545-p-3-a0005

  reg:
    maxItems: 1

  reset-gpios: true

  vddio-supply: true

  vci-supply: true

  port: true

required:
  - compatible
  - reg
  - reset-gpios
  - vddio-supply
  - vci-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,aa545-p-3-a0005";
            reg = <0>;
            reset-gpios = <&tlmm 133 GPIO_ACTIVE_LOW>;
            vddio-supply = <&vreg_l12b_1p8>;
            vci-supply = <&vreg_l13b_3p0>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
