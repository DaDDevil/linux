%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx581.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX581 image sensor

maintainers:
  - DaDDevil <hexiaoshan520@gmail.com>

description:
  Sony IMX581 is an 8000 by 6000 pixel CMOS image sensor. This binding
  describes a three-trio CSI-2 C-PHY connection with a 19.2 MHz input clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx581

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  power-domains:
    maxItems: 1

  avdd-supply:
    description: Analog power supply.

  dvdd-supply:
    description: Digital core power supply.

  dovdd-supply:
    description: Digital interface power supply.

  auxvdd-supply:
    description: Auxiliary power supply for the camera module.

  afvdd-supply:
    description: Power supply for the camera module autofocus circuit.

  reset-gpios:
    description: Active-low sensor reset.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          bus-type:
            const: 1 # MEDIA_BUS_TYPE_CSI2_CPHY

          data-lanes:
            items:
              - const: 0
              - const: 1
              - const: 2
        required:
          - bus-type
          - data-lanes
          - link-frequencies
    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - auxvdd-supply
  - afvdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx581";
            reg = <0x1a>;
            clocks = <&cam_mclk>;
            reset-gpios = <&gpio 14 GPIO_ACTIVE_LOW>;
            avdd-supply = <&cam_avdd>;
            dvdd-supply = <&cam_dvdd>;
            dovdd-supply = <&cam_dovdd>;
            auxvdd-supply = <&cam_auxvdd>;
            afvdd-supply = <&cam_afvdd>;
            port {
                endpoint {
                    bus-type = <1>;
                    data-lanes = <0 1 2>;
                    link-frequencies = /bits/ 64 <1422400000>;
                    remote-endpoint = <&csiphy_in>;
                };
            };
        };
    };
